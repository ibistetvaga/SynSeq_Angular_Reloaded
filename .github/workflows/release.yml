name: Release synseq-ng

# Builds the library and publishes it to npm when a "v*" tag is pushed.
# The tarball is attached to the GitHub Release as a binary asset.
#
# One-time setup on GitHub:
#   1. Settings -> Secrets and variables -> Actions
#      -> New repository secret: NPM_TOKEN (a token with publish scope and
#         "Bypass 2FA", since Actions cannot answer an OTP prompt)
#   2. Settings -> Actions -> "Allow all actions and reusable workflows"
#
# Usage:
#   git tag v0.2.0
#   git push origin main --tags
#   -> publishes to npm and creates the GitHub Release.
#
# The version comes from projects/soundboard-ng/package.json, NOT from the tag.
# Bump it in the same commit you tag, or npm will reject a republish of an
# already-published version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm install

      # Publishing something whose tests have never been run is how the chord
      # bug survived for the entire life of the project.
      - name: Test
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Pack
        id: pack
        run: |
          VERSION=$(node -p "require('./projects/soundboard-ng/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          npm pack dist/synseq-ng --pack-destination .
          ls -la synseq-ng-*.tgz

      - name: Publish to npm
        working-directory: dist/synseq-ng
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: synseq-ng ${{ steps.pack.outputs.version }}
          body: |
            Angular 22 standalone library: synthesiser, piano keyboard,
            sequencer, piano roll, presets and a localStorage sequence cache.

            No styling setup and no providers required.

            ## Install

            ```bash
            npm install synseq-ng@${{ steps.pack.outputs.version }}
            ```
          files: synseq-ng-${{ steps.pack.outputs.version }}.tgz
          fail_on_unmatched_files: true
